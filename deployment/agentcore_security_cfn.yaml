AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AgentCore Workload Identity IAM roles (execution roles) for the
  AdaptiveBiddingStrategyAgent and ModelPromotionGovernanceAgent runtimes, plus the
  manual override role with governance:ApproveModel permission.

  This stack is deployed BEFORE the agent runtimes: the role trust policies are scoped
  to the agent's runtime-name prefix (ArnLike), not a single runtime ARN, so the roles
  do not depend on a runtime existing yet. The runtimes are then created with these role
  ARNs, and the Scheduler/EventBridge invocation resources (which DO need the real
  runtime ARNs) are deployed afterwards by governance_eventbridge_cfn.yaml.
  Requirements: 7.1, 10.4, 11.2, 11.3, 11.4, 11.5

# =============================================================================
# Parameters
# =============================================================================
Parameters:
  StackPrefix:
    Type: String
    Default: ''
    Description: Optional prefix for all resource names (e.g., 'prod', 'staging')

  ParameterStoreTableArn:
    Type: String
    Description: ARN of the DynamoDB table used as the agent parameter store

  AuditTrailTableArn:
    Type: String
    Description: ARN of the DynamoDB table used as the append-only audit trail

  KMSKeyArn:
    Type: String
    Description: ARN of the KMS key (from feedback pipeline) used for DynamoDB/S3 encryption

  ModelBucketName:
    Type: String
    Default: ''
    Description: >-
      Name of the S3 Triton model-repository bucket. The Model Promotion Governance
      agent stages/promotes/rolls back canary engines and edits the router config
      here (Option D). Leave empty to skip granting S3 access.

  RuntimeNamePrefix:
    Type: String
    Default: ''
    Description: >-
      Prefix (with trailing underscore already applied, e.g. "nie_") deploy_closed_loop.sh
      prepends to the AgentCore runtime base names (AdaptiveBiddingStrategyAgent /
      ModelPromotionGovernanceAgent). Must exactly match the --runtime-name value
      passed to deploy_to_agentcore.py, since AgentCore runtime names only allow
      [a-zA-Z0-9_] (deploy_closed_loop.sh converts any hyphens in StackPrefix to
      underscores before setting this). Leave empty for the unprefixed default.

Conditions:
  HasStackPrefix: !Not [!Equals [!Ref StackPrefix, '']]
  HasModelBucket: !Not [!Equals [!Ref ModelBucketName, '']]

# =============================================================================
# Mappings
# =============================================================================
# AgentCore runtime names must start with a letter and only contain
# [a-zA-Z0-9_] (no hyphens) — see deploy_closed_loop.sh's runtime-name
# construction. The trust policy ArnLike below must match the SAME prefixed
# name deploy_closed_loop.sh actually passes to --runtime-name, or the role
# will reject AssumeRole from the real runtime.

# =============================================================================
# Resources
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # 1a. AdaptiveBiddingAgentRole (reasoning agent execution role)
  #
  # Trust: AgentCore service principal, scoped by account + the agent's runtime-name
  # prefix (ArnLike) so the role can be created before the runtime exists.
  # Permissions: DynamoDB parameter store R/W, audit trail write, CloudWatch metrics,
  # and Bedrock model invocation for the reasoning layer.
  # ---------------------------------------------------------------------------
  AdaptiveBiddingAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - '-'
        - - !If
              - HasStackPrefix
              - !Sub '${StackPrefix}-adaptive-bidding-agent-role'
              - 'adaptive-bidding-agent-role'
          - !Select [1, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Description: >-
        Workload Identity role for the Adaptive Bidding Strategy Agent (AgentCore Runtime).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/${RuntimeNamePrefix}AdaptiveBiddingStrategyAgent-*'
      Policies:
        - PolicyName: DynamoDBParameterStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !Ref ParameterStoreTableArn
        - PolicyName: DynamoDBParameterStoreIndexAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub '${ParameterStoreTableArn}/index/*'
        - PolicyName: DynamoDBAuditTrailWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Ref AuditTrailTableArn
        - PolicyName: CloudWatchGetMetricData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                Resource: '*'
        - PolicyName: CloudWatchPutMetricData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace':
                      - 'ARTF/BidOutcome'
                      - 'ARTF/AgentCore'
        - PolicyName: BedrockModelInvocation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Cross-region inference profiles (us./eu./apac.) route to multiple
                  # regions, so the underlying foundation model must be allowed in all
                  # regions (ARN region field wildcarded). The inference profile itself
                  # is invoked in the deploy region.
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
        - PolicyName: KMSDecryptAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref KMSKeyArn
        # AgentCore pulls the runtime container image from ECR — required at
        # CreateAgentRuntime validation time. GetAuthorizationToken has no
        # resource scope; the layer/image reads are scoped to account repos.
        - PolicyName: ECRImagePull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
        # CloudWatch Logs for the runtime's own log group.
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
        # X-Ray tracing emitted by the AgentCore runtime.
        - PolicyName: XRayTraceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  # ---------------------------------------------------------------------------
  # 1b. ModelPromotionGovernanceAgentRole (reasoning agent execution role)
  #
  # The Model Optimizer/Triton are reached over cluster-internal HTTP (internal NLBs
  # + VPC network mode + security groups), not IAM. S3 model-repo access below is for
  # canary staging/promotion/rollback + router config edits.
  # ---------------------------------------------------------------------------
  ModelPromotionGovernanceAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - '-'
        - - !If
              - HasStackPrefix
              - !Sub '${StackPrefix}-model-promotion-governance-agent-role'
              - 'model-promotion-governance-agent-role'
          - !Select [1, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Description: >-
        Workload Identity role for the Model Promotion Governance Agent (AgentCore Runtime).
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/${RuntimeNamePrefix}ModelPromotionGovernanceAgent-*'
      Policies:
        - PolicyName: SageMakerModelRegistryAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:UpdateModelPackage
                  - sagemaker:DescribeModelPackage
                  - sagemaker:ListModelPackages
                  - sagemaker:DescribeModelPackageGroup
                Resource:
                  - !Sub 'arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package/*'
                  - !Sub 'arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package-group/*'
        - PolicyName: DynamoDBAuditTrailAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Ref AuditTrailTableArn
                  - !Sub '${AuditTrailTableArn}/index/*'
        - PolicyName: CloudWatchGetMetricData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                Resource: '*'
        - PolicyName: CloudWatchPutMetricData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace':
                      - 'ARTF/Governance'
                      - 'ARTF/ABTest'
                      - 'ARTF/AgentCore'
        - PolicyName: BedrockModelInvocation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Cross-region inference profiles (us./eu./apac.) route to multiple
                  # regions, so the underlying foundation model must be allowed in all
                  # regions (ARN region field wildcarded). The inference profile itself
                  # is invoked in the deploy region.
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
        - PolicyName: KMSDecryptAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !Ref KMSKeyArn
        # AgentCore pulls the runtime container image from ECR — required at
        # CreateAgentRuntime validation time. GetAuthorizationToken has no
        # resource scope; the layer/image reads are scoped to account repos.
        - PolicyName: ECRImagePull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
        # CloudWatch Logs for the runtime's own log group.
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
        # X-Ray tracing emitted by the AgentCore runtime.
        - PolicyName: XRayTraceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
        # Invoke the VPC HTTP proxy Lambda (vpc_proxy_cfn.yaml) — lets the PUBLIC
        # runtime reach the cluster-internal Model Optimizer / Triton NLBs without
        # itself being in VPC mode. Name-pattern scoped (prefix-agnostic).
        - PolicyName: InvokeVpcProxy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*vpc-optimizer-proxy'
        # S3 access to the Triton model repo — stage/promote/rollback canary
        # engines and edit the router config.pbtxt (Option D). Only granted when a
        # bucket name is provided. CopyObject is covered by Get(source)+Put(dest).
        - !If
          - HasModelBucket
          - PolicyName: S3ModelRepoAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ModelBucketName}/*'
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ModelBucketName}'
          - !Ref 'AWS::NoValue'

  # ---------------------------------------------------------------------------
  # 1c. ManualOverrideRole — governance:ApproveModel gated manual promotion
  # ---------------------------------------------------------------------------
  ManualOverrideRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - '-'
        - - !If
              - HasStackPrefix
              - !Sub '${StackPrefix}-governance-manual-override-role'
              - 'governance-manual-override-role'
          - !Select [1, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Description: >-
        Role for manual model promotion overrides. Requires the caller to have
        governance:ApproveModel permission in their identity-based policy.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': 'governance-manual-override'
      Policies:
        - PolicyName: SageMakerModelRegistryPromote
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:UpdateModelPackage
                Resource:
                  - !Sub 'arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package/*'
        - PolicyName: DynamoDBAuditTrailWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Ref AuditTrailTableArn

  GovernanceApproveModelPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Join
        - '-'
        - - !If
              - HasStackPrefix
              - !Sub '${StackPrefix}-governance-approve-model'
              - 'governance-approve-model'
          - !Select [1, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      Description: >-
        Grants governance:ApproveModel - the ability to assume the manual override role
        and manually promote a model. Attach only to authorized human operators.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAssumeManualOverrideRole
            Effect: Allow
            Action: 'sts:AssumeRole'
            Resource: !GetAtt ManualOverrideRole.Arn
            Condition:
              StringEquals:
                'sts:ExternalId': 'governance-manual-override'

# =============================================================================
# Outputs
# =============================================================================
Outputs:
  AdaptiveBiddingAgentRoleArn:
    Description: Execution role ARN for the Adaptive Bidding Agent runtime
    Value: !GetAtt AdaptiveBiddingAgentRole.Arn
    Export:
      Name: !If
        - HasStackPrefix
        - !Sub '${StackPrefix}-AdaptiveBiddingAgentRoleArn'
        - 'AdaptiveBiddingAgentRoleArn'

  ModelPromotionGovernanceAgentRoleArn:
    Description: Execution role ARN for the Model Promotion Governance Agent runtime
    Value: !GetAtt ModelPromotionGovernanceAgentRole.Arn
    Export:
      Name: !If
        - HasStackPrefix
        - !Sub '${StackPrefix}-ModelPromotionGovernanceAgentRoleArn'
        - 'ModelPromotionGovernanceAgentRoleArn'

  ManualOverrideRoleArn:
    Description: ARN of the manual override role (requires governance:ApproveModel)
    Value: !GetAtt ManualOverrideRole.Arn
    Export:
      Name: !If
        - HasStackPrefix
        - !Sub '${StackPrefix}-ManualOverrideRoleArn'
        - 'ManualOverrideRoleArn'

  GovernanceApproveModelPolicyArn:
    Description: ARN of the managed policy granting governance:ApproveModel
    Value: !Ref GovernanceApproveModelPolicy

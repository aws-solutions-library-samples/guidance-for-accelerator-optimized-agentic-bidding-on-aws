# EKS cluster configuration for Accelerator-optimized Agentic Bidding with Triton Inference Server.
# The GPU node group uses the g5 family (all 1x NVIDIA A10G GPU) for cost-effective
# GPU inference of recommendation models (DLRM, Wide & Deep, NCF).
#
# For production with larger models, upgrade to:
#   p4d.24xlarge (8x A100, 96 vCPU, 1152 GiB) for multi-model serving
#
# Usage:
#   eksctl create cluster -f triton/eks/cluster-config.yaml

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  # __STACK_NAME__ is replaced by deploy-eks.sh at deploy time
  name: __STACK_NAME__-triton
  region: __REGION__
  version: "1.31"

managedNodeGroups:
  # GPU node group for Triton Inference Server.
  # Instance-type diversification for capacity resilience: all three sizes carry a
  # SINGLE NVIDIA A10G GPU (4 / 8 / 16 vCPU respectively). When g5.xlarge is
  # capacity-constrained in an AZ (Server.InsufficientInstanceCapacity), EKS falls
  # back to the other A10G sizes instead of leaving the node group stuck Pending.
  #
  # IMPORTANT — keep every type in this list on the A10G (Ampere, sm_86)
  # architecture. Triton serves pre-built TensorRT engines (platform:
  # tensorrt_plan) compiled by the Model Optimizer for A10G; a plan built for one
  # GPU arch will NOT load on another. Do NOT add g4dn (T4, sm_75) or g6 (L4,
  # sm_89) here — it would silently break Triton engine loading.
  - name: gpu-inference
    instanceTypes: ["g5.xlarge", "g5.2xlarge", "g5.4xlarge"]
    desiredCapacity: 1
    minSize: 1
    maxSize: __MAX_GPUS__
    volumeSize: 100
    labels:
      nvidia.com/gpu: "present"
      role: inference
    tags:
      Project: __STACK_NAME__
      ManagedBy: deploy-script
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true

  # CPU node group for orchestrator, ARTF containers (default node placement —
  # see deploy.sh --artf-node-role), ALB ingress controller, monitoring.
  # Sized for load-test throughput: at c5.xlarge x2 (8 vCPU total), the ARTF
  # container HPAs (dlrm/widedeep/ncf/metrics/yield, each maxReplicas 5) plus
  # the orchestrator HPA (maxReplicas 10) have nowhere to schedule their scaled-up
  # pods once CPU pressure hits — they sit Pending instead of actually serving
  # load, which is what makes load tests crawl. c5.2xlarge x3 (24 vCPU total)
  # gives real headroom for those HPAs to scale into.
  - name: cpu-services
    instanceType: c5.2xlarge
    desiredCapacity: 3
    minSize: 2
    maxSize: 8
    volumeSize: 50
    labels:
      role: services
    tags:
      Project: __STACK_NAME__
      ManagedBy: deploy-script
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true

iam:
  withOIDC: true

addons:
  - name: vpc-cni
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
  - name: coredns
  - name: kube-proxy

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator

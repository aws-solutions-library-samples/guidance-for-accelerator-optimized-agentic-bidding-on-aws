# EKS cluster configuration for Accelerator-optimized Agentic Bidding with Triton Inference Server.
# The GPU node group uses the g6 family (all 1x NVIDIA L4 GPU) for cost-effective
# GPU inference of recommendation models (DLRM, Wide & Deep, NCF).
#
# For production with larger models, upgrade to:
#   p4d.24xlarge (8x A100, 96 vCPU, 1152 GiB) for multi-model serving
#
# Usage:
#   eksctl create cluster -f triton/eks/cluster-config.yaml

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  # __STACK_NAME__ is replaced by deploy-eks.sh at deploy time
  name: __STACK_NAME__-triton
  region: __REGION__
  # A version in EKS standard support ($0.10/h control plane). A version in
  # extended support bills $0.60/h, and EKS stops creating clusters on a version
  # once its extended support ends. Check `aws eks describe-cluster-versions`
  # before release and move this forward when standard support nears its end
  # (1.35: standard support until 2027-03-26).
  version: "1.35"
  annotations:
    description: "S7734 Guidance for Accelerator-Optimized Agentic Bidding on AWS"

# Three AZs, not eksctl's default of two picked at random. The GPU nodegroup is
# On-Demand g6, and On-Demand capacity for a GPU instance type comes and goes per
# AZ: a two-AZ VPC is one capacity event away from a nodegroup that cannot launch
# at all, because the type can have no capacity in the two AZs eksctl chose while
# other AZs in the region have it, and a two-AZ VPC has no subnets there to use.
# Spreading the VPC across AZs is the lever that buys
# capacity resilience; see the note on instanceTypes below for what does not.
availabilityZones: ["__REGION__a", "__REGION__b", "__REGION__c"]

# Nodes are PRIVATE (privateNetworking: true on every nodegroup below), so all node
# egress -- ECR pulls, S3 model traffic, STS, nvcr.io, the GitHub-hosted device-plugin
# and CRD manifests -- leaves through NAT gateways. One per AZ rather than eksctl's
# default of one in total: with a single gateway, that AZ's loss takes every node's
# outbound path with it, and the three-AZ spread above exists precisely so one AZ is
# not load-bearing. Cost: three NAT gateway hours plus per-GB processing instead of
# one; see the README cost table.
vpc:
  nat:
    gateway: HighlyAvailable

managedNodeGroups:
  # GPU node group for Triton Inference Server.
  #
  # All three types carry a SINGLE NVIDIA L4 GPU (24 GB; 8 / 16 / 4 vCPU). The
  # list is the ORDER deploy.sh tries them in. EKS backs a managed nodegroup with
  # an Auto Scaling group whose On-Demand allocation strategy is `prioritized`: on
  # InsufficientInstanceCapacity it retries the first type and never the others
  # (EC2 Auto Scaling "Allocation strategies for multiple instance types"). So
  # eksctl create cluster gets this config WITHOUT this group, and deploy.sh's
  # ensure_gpu_nodegroup creates it with one type at a time and 0 nodes, scales it
  # to 1, and moves to the next type when the launch fails for capacity in every
  # AZ. desiredCapacity / minSize below apply once a type has launched.
  #
  # g6 (L4) replaced g5 (A10G): in us-east-1, g5.xlarge On-Demand capacity was
  # exhausted in all three of the cluster's AZs for 19+ hours (zero launches), and
  # g5.2xlarge scored as low. g6.2xlarge is $0.9776/h; g5.2xlarge was $1.212/h.
  # A family change on an existing cluster is refused (see
  # reconcile_gpu_instance_types), because engines built for the old GPU would
  # stay in S3 and fail to load on the new one.
  #
  # IMPORTANT: keep every type in this list on the SAME GPU model (L4, Ada,
  # sm_89). Triton serves TensorRT engines (platform: tensorrt_plan) that the
  # Model Optimizer compiles on this nodegroup, and trtexec builds without a
  # hardware-compatibility level, so an engine loads only on the GPU it was built
  # for. Do NOT add g5 (A10G, sm_86), g4dn (T4, sm_75) or g6e (L40S, a different
  # sm_89 GPU) here; it would silently break Triton engine loading.
  #
  # privateNetworking: true -- nodes launch in the private subnets with no public IP.
  # eksctl's default places managed nodes in the PUBLIC subnets, which does not
  # work in an account running VPC Block Public Access in block-ingress mode:
  # only NAT-gateway traffic is allowed, so nodes routing via the internet gateway
  # cannot reach the EKS endpoint or ECR and never join ("NodeCreationFailure:
  # Instances failed to join the kubernetes cluster", CPU and GPU nodes alike).
  # Nothing reaches a node directly, and
  # nothing in the cluster is internet-facing: the orchestrator is a ClusterIP
  # Service reached by the ui-api-proxy Lambda inside the VPC, Triton is behind
  # an internal NLB, Prebid Server is in-cluster over service DNS, and the VPC
  # proxy Lambda sits inside the VPC.
  - name: gpu-inference
    instanceTypes: ["g6.2xlarge", "g6.4xlarge", "g6.xlarge"]
    privateNetworking: true
    desiredCapacity: 1
    minSize: 1
    maxSize: __MAX_GPUS__
    volumeSize: 100
    labels:
      nvidia.com/gpu: "present"
      role: inference
    tags:
      Project: __STACK_NAME__
      ManagedBy: deploy-script
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true

  # CPU node group for orchestrator, ARTF containers (default node placement —
  # see deploy.sh --artf-node-role), ALB ingress controller, monitoring.
  # Sized for load-test throughput: at c5.xlarge x2 (8 vCPU total), the ARTF
  # container HPAs (dlrm/widedeep/ncf/metrics/yield, each maxReplicas 5) plus
  # the orchestrator HPA (maxReplicas 10) have nowhere to schedule their scaled-up
  # pods once CPU pressure hits — they sit Pending instead of actually serving
  # load, which is what makes load tests crawl. c5.2xlarge x3 (24 vCPU total)
  # gives real headroom for those HPAs to scale into.
  - name: cpu-services
    instanceType: c5.2xlarge
    privateNetworking: true   # see gpu-inference above
    desiredCapacity: 3
    minSize: 2
    maxSize: 8
    volumeSize: 50
    labels:
      role: services
    tags:
      Project: __STACK_NAME__
      ManagedBy: deploy-script
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true

iam:
  withOIDC: true

addons:
  - name: vpc-cni
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
    # Enforce Kubernetes NetworkPolicy (standard mode). Without it the demand
    # service's Prebid-only policy is applied but inert. deploy_prebid.sh turns
    # this on for clusters created before this line existed.
    configurationValues: |-
      enableNetworkPolicy: "true"
  - name: coredns
  - name: kube-proxy

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator

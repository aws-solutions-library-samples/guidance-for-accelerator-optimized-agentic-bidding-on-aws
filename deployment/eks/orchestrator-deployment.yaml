# Orchestrator deployment — fans out to ARTF containers via Kubernetes Services.
# Exposed via AWS ALB Ingress Controller.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app: artf
    component: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: artf
      component: orchestrator
  template:
    metadata:
      labels:
        app: artf
        component: orchestrator
    spec:
      # Pin to the CPU/services node group. The orchestrator is a lightweight
      # always-on router with no GPU workload — without this it can schedule
      # onto the GPU/inference node, whose node role never gets the
      # closed-loop IAM policy attached (deploy.sh Step 7.7 attaches it only
      # to the services node group), causing every DynamoDB
      # parameter-store/audit-trail read from that pod to fail with
      # AccessDeniedException.
      nodeSelector:
        role: services
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: __REGISTRY__/__STACK_NAME__-orchestrator:__IMAGE_TAG__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          env:
            # Service DNS names below match the k8s Service names in
            # artf-containers-deployment.yaml (job-oriented display names — see
            # RENAME_MAP.md). Env var names are unchanged internal identifiers
            # read by source/orchestrator/app.py.
            - name: DLRM_URL
              value: "http://bid-pricer:8081"
            - name: WIDEDEEP_URL
              value: "http://audience-activator:8081"
            - name: NCF_URL
              value: "http://deal-scorer:8081"
            - name: METRICS_URL
              value: "http://signals-enricher:8081"
            - name: YIELD_URL
              value: "http://yield-optimizer:8081"
            - name: LOADTEST_TABLE
              value: "__STACK_NAME__-loadtest-history"
            - name: EKS_CLUSTER_NAME
              value: "__STACK_NAME__-triton"
            - name: GPU_NODEGROUP_NAME
              value: "gpu-inference"
            - name: AWS_DEFAULT_REGION
              value: "__REGION__"
            - name: COGNITO_USER_POOL_ID
              value: "__COGNITO_USER_POOL_ID__"
            - name: COGNITO_REGION
              value: "__REGION__"
            # Part 2 closed-loop demo API — DynamoDB tables created by
            # deploy_closed_loop.sh (closed_loop_cfn.yaml). deploy.sh substitutes
            # these with the stack-prefix-aware names (e.g. "dv2-parameter-store")
            # so the orchestrator and the AgentCore agents read the SAME tables.
            - name: PARAMETER_STORE_TABLE
              value: "__PARAMETER_STORE_TABLE__"
            - name: AUDIT_TRAIL_TABLE
              value: "__AUDIT_TRAIL_TABLE__"
            # SageMaker Model Package Group names, stack-prefix-aware to match
            # closed_loop_cfn.yaml's HasStackPrefix naming (e.g.
            # "dv2-artf-dlrm-bid-shader"). Without these, closed_loop_api.py's
            # _model_group() falls back to the unprefixed default
            # ("artf-dlrm-bid-shader"), which does not exist when a stack
            # prefix is in use — the Governance page's model registry list
            # would query a group name that was never created.
            - name: CLOSED_LOOP_MODEL_GROUP_DLRM_BID_SHADER
              value: "__DLRM_MODEL_GROUP__"
            - name: CLOSED_LOOP_MODEL_GROUP_NCF_DEAL_MANAGER
              value: "__NCF_MODEL_GROUP__"
            # Same stack-prefix-aware Model Package Group wiring as above,
            # for the Yield Optimizer's two independently-trained sub-models
            # (see training/xgboost_pipeline.py's module docstring on the
            # FIL multi-output-limitation correction). Without these,
            # closed_loop_api._model_group() falls back to the unprefixed
            # default, which does not exist when a stack prefix is in use.
            - name: CLOSED_LOOP_MODEL_GROUP_DEAL_YIELD_MANAGER_FLOOR
              value: "__YIELD_FLOOR_MODEL_GROUP__"
            - name: CLOSED_LOOP_MODEL_GROUP_DEAL_YIELD_MANAGER_MARGIN
              value: "__YIELD_MARGIN_MODEL_GROUP__"
            # Governance panel on-demand training trigger (Train-from-Load-Test
            # feature, Unit 2). Reuses the SageMaker training execution role
            # and buckets closed_loop_cfn.yaml already provisions (Condition:
            # HasTrainingBuckets) — same infra the scheduled retraining Lambda
            # uses, not a new/parallel setup.
            - name: SAGEMAKER_TRAINING_ROLE_ARN
              value: "__SAGEMAKER_TRAINING_ROLE_ARN__"
            - name: MODEL_BUCKET
              value: "__MODEL_BUCKET__"
            - name: TRAINING_DATA_BUCKET
              value: "__TRAINING_DATA_BUCKET__"
            - name: TRAINING_IMAGE_REGISTRY
              value: "__TRAINING_IMAGE_REGISTRY__"
            # SageMaker's built-in XGBoost algorithm container URI, resolved
            # at deploy time (see deploy_closed_loop.sh's own resolution for
            # the scheduled retraining Lambda) -- required only for
            # deal_yield_manager_floor/margin's on-demand training trigger
            # (orchestrator/training_trigger.py's xgboost-shaped branch).
            # Left empty when unresolved (e.g. sagemaker SDK unavailable at
            # deploy time) -- training_trigger.py raises a clear,
            # never-fabricated error for that model type until this is set,
            # rather than guessing a SageMaker-owned account ID/URI.
            - name: XGBOOST_TRAINING_IMAGE_URI
              value: "__XGBOOST_TRAINING_IMAGE_URI__"
            # Feedback pipeline (source/orchestrator/feedback_integration.py):
            # emits real BidShadingOutcomeEvents (live traffic + load-test outcome
            # capture) to the Kinesis stream created by feedback_pipeline_cfn.yaml
            # / deploy_closed_loop.sh Step 1. Left empty (--with-retraining not
            # used) means emission is a documented no-op, not a fabricated
            # success — see FeedbackCollector's own "unset -> disabled" contract.
            - name: FEEDBACK_STREAM_NAME
              value: "__FEEDBACK_STREAM_NAME__"
            # Deal yield feedback pipeline (source/orchestrator/
            # deal_yield_feedback.py): emits real DealYieldOutcomeEvents for
            # ADJUST_DEAL_FLOOR/ADJUST_DEAL_MARGIN mutations. Separate stream
            # from FEEDBACK_STREAM_NAME above -- see
            # aidlc-docs/construction/deal-yield-outcome-capture/functional-design/
            # for why. Same "unset -> disabled, not fabricated" contract.
            - name: DEAL_YIELD_FEEDBACK_STREAM_NAME
              value: "__DEAL_YIELD_FEEDBACK_STREAM_NAME__"
            # Glue ETL job names (source/orchestrator/governance_api.py's
            # trainable_runs_handler) -- used to check whether a completed
            # Glue job run has actually swept a load test's data into
            # training-data/ before offering it in the "Train from load
            # test" run picker.
            - name: GLUE_JOB_NAME
              value: "__GLUE_JOB_NAME__"
            - name: DEAL_YIELD_GLUE_JOB_NAME
              value: "__DEAL_YIELD_GLUE_JOB_NAME__"
            # NOTE: The orchestrator does NOT invoke agent runtimes. Agent
            # invocation is browser-direct (SigV4 via the Cognito Identity Pool).
            # The former BID_SHADING_RUNTIME_ARN env was removed intentionally.
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: artf
    component: orchestrator

---
# HPA for orchestrator — scale on CPU utilization
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

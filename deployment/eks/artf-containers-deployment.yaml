# ARTF container deployments.
#
# This guidance has four NVIDIA containers. Two model containers (Bid Pricer, Deal
# Scorer) delegate inference to Triton over the cluster network and hold NO GPU
# themselves, so their node placement is parameterized via __ARTF_NODE_ROLE__
# (set by deploy.sh --artf-node-role):
#   - services (DEFAULT): run on CPU nodes — keeps load-test scale-out off the
#     scarce GPU nodes; they reach Triton via its ClusterIP Service DNS.
#   - inference: co-locate on the GPU node (role=inference) for minimal hop.
# The GPU toleration is kept in both cases (harmless on CPU nodes, required on the
# GPU node). The other two containers, the Audience Activator and the
# Signals Enricher, are rule-based and always run on CPU nodes (role=services, no
# GPU dependency, no Triton call). Audience activation was switched from a Triton
# Wide & Deep model to deterministic rules (its ONNX graph could not be compiled
# to a TensorRT engine, and it is slated to be replaced by a partner ISV
# implementation) — see source/containers/widedeep_segment_activator/app.py.
#
# See RENAME_MAP.md for the display-name -> internal-identifier mapping (these
# resource names are the new job-oriented display names; the container source
# directories, Triton model names, and orchestrator internal keys are unchanged).
#
# Architecture:
#   [Bid Pricer / Deal Scorer] --tritonclient.http--> [Triton Server (GPU node)]
#   [Audience Activator / Signals Enricher] (CPU node) -- rule-based, no Triton -->

---
# Bid Pricer — runs on GPU node for co-location with Triton
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bid-pricer
  labels:
    app: artf
    model: dlrm
spec:
  # Matches the HPA's minReplicas so a fresh apply starts at the warm floor
  # instead of creating one pod and waiting for the HPA to reconcile. Kept
  # equal to minReplicas (not higher) because kubectl apply rewrites this
  # field on every deploy, which would otherwise fight an HPA that had already
  # scaled out.
  replicas: 2
  selector:
    matchLabels:
      app: artf
      model: dlrm
  template:
    metadata:
      labels:
        app: artf
        model: dlrm
    spec:
      nodeSelector:
        role: __ARTF_NODE_ROLE__
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dlrm
          image: __REGISTRY__/__STACK_NAME__-bid-pricer:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: mcp
            - containerPort: 8080
              name: health
            - containerPort: 50051
              name: grpc
          env:
            - name: TRITON_URL
              value: "triton-inference-server:8000"
            - name: TRITON_PROTOCOL
              value: "http"
            - name: TRITON_GRPC_URL
              value: "triton-inference-server:8001"
            - name: USE_TRITON
              value: "true"
          # A 500m CPU limit means 50ms of CPU per 100ms CFS period: once a
          # request exhausts it the pod is throttled until the next period,
          # adding latency in 100ms multiples. That compounded with the
          # blocking-mutate() serialisation (see shared/server.py's
          # _await_mutate) to produce hundreds-of-ms container latencies in
          # load tests. The limit is raised well above the request so bursts
          # (JSON parse + pydantic validation + numpy + Triton round trip
          # across ARTF_MUTATE_WORKERS threads) are not clipped; the request
          # is what the scheduler and the HPA's 70% target both work from.
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: bid-pricer
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: mcp
    - port: 8080
      targetPort: 8080
      name: health
    - port: 50051
      targetPort: 50051
      name: grpc
  selector:
    app: artf
    model: dlrm


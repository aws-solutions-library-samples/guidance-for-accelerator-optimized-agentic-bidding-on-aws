# ARTF container deployments.
#
# This guidance has four NVIDIA containers. Two model containers (DLRM, NCF)
# delegate inference to Triton over the cluster network and hold NO GPU
# themselves, so their node placement is parameterized via __ARTF_NODE_ROLE__
# (set by deploy.sh --artf-node-role):
#   - services (DEFAULT): run on CPU nodes — keeps load-test scale-out off the
#     scarce GPU nodes; they reach Triton via its ClusterIP Service DNS.
#   - inference: co-locate on the GPU node (role=inference) for minimal hop.
# The GPU toleration is kept in both cases (harmless on CPU nodes, required on the
# GPU node). The other two containers, the Wide & Deep Segment Activator and the
# Metrics Enricher, are rule-based and always run on CPU nodes (role=services, no
# GPU dependency, no Triton call). Segment activation was switched from a Triton
# Wide & Deep model to deterministic rules (its ONNX graph could not be compiled
# to a TensorRT engine, and it is slated to be replaced by a partner ISV
# implementation) — see source/containers/widedeep_segment_activator/app.py.
#
# Architecture:
#   [DLRM / NCF] --tritonclient.http--> [Triton Server (GPU node)]
#   [Wide & Deep Segment Activator / Metrics Enricher] (CPU node) -- rule-based, no Triton -->

---
# DLRM Bid Shader — runs on GPU node for co-location with Triton
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlrm-bid-shader
  labels:
    app: artf
    model: dlrm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artf
      model: dlrm
  template:
    metadata:
      labels:
        app: artf
        model: dlrm
    spec:
      nodeSelector:
        role: __ARTF_NODE_ROLE__
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dlrm
          image: __REGISTRY__/__STACK_NAME__-dlrm-bid-shader:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: mcp
            - containerPort: 8080
              name: health
            - containerPort: 50051
              name: grpc
          env:
            - name: TRITON_URL
              value: "triton-inference-server:8000"
            - name: USE_TRITON
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: dlrm-bid-shader
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: mcp
    - port: 8080
      targetPort: 8080
      name: health
    - port: 50051
      targetPort: 50051
      name: grpc
  selector:
    app: artf
    model: dlrm

---
# Wide & Deep Segment Activator — rule-based (no Triton, no GPU); always runs
# on CPU nodes. Segment activation was switched from a Triton Wide & Deep model
# to deterministic rules — see
# source/containers/widedeep_segment_activator/app.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widedeep-segment-activator
  labels:
    app: artf
    model: widedeep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artf
      model: widedeep
  template:
    metadata:
      labels:
        app: artf
        model: widedeep
    spec:
      nodeSelector:
        role: services
      containers:
        - name: widedeep
          image: __REGISTRY__/__STACK_NAME__-widedeep-segment-activator:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: mcp
            - containerPort: 8080
              name: health
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: widedeep-segment-activator
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: mcp
    - port: 8080
      targetPort: 8080
      name: health
    - port: 50051
      targetPort: 50051
      name: grpc
  selector:
    app: artf
    model: widedeep


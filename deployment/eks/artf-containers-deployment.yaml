    name: yield-optimizer-floor
  # minReplicas 2, not 1: the HPA owns the replica count, so a Deployment
  # replicas: 2 would be scaled straight back to 1 while idle. Load tests were
  # therefore starting cold against a single pod per container and waiting on
  # reactive scaling (metrics-server observation, then a ~15s HPA sync, then
  # scheduling and readiness) for much of a short run. loadtest.py's
  # _scale_containers() is a documented no-op, so this is the only pre-warm.
  minReplicas: 2
  maxReplicas: 5
  metrics:

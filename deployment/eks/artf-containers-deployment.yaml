---
# Yield Optimizer (Floor) — runs on GPU node for co-location with Triton
# (ADJUST_DEAL_FLOOR via the deal_yield_manager_floor Triton FIL XGBoost model)
#
# Two Deployments, not one: Triton's FIL backend cannot serve a two-output tree
# model, so the floor and margin predictions were always two separate models.
# Separate Deployments stop one model's rollout or crashloop from taking the
# other's intent offline (BR-5 -- the two intents are independent and atomic).
#
# NOTE the label is `model: yield-floor`, not `model: yield`. Both Deployments
# sharing `model: yield` would make each Service select BOTH models' pods and
# round-robin ADJUST_DEAL_FLOOR calls into the margin container half the time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yield-optimizer-floor
  labels:
    app: artf
    model: yield-floor
spec:
  # Matches the HPA's minReplicas so a fresh apply starts at the warm floor
  # instead of creating one pod and waiting for the HPA to reconcile. Kept
  # equal to minReplicas (not higher) because kubectl apply rewrites this
  # field on every deploy, which would otherwise fight an HPA that had already
  # scaled out.
  replicas: 2
  selector:
    matchLabels:
      app: artf
      model: yield-floor
  template:
    metadata:
      labels:
        app: artf
        model: yield-floor
    spec:
      nodeSelector:
        role: __ARTF_NODE_ROLE__
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: yield-floor
          image: __REGISTRY__/__STACK_NAME__-yield-optimizer-floor:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: mcp
            - containerPort: 8080
              name: health
            - containerPort: 50051
              name: grpc
          env:
            - name: TRITON_URL
              value: "triton-inference-server:8000"
            - name: TRITON_PROTOCOL
              value: "http"
            - name: TRITON_GRPC_URL
              value: "triton-inference-server:8001"
            - name: USE_TRITON
              value: "true"
            # Bounded epsilon-greedy exploration (breaks the genesis model's
            # cold-start deadlock -- see shared/yield_exploration.py and
            # CLOSED_LOOP.md's "Yield Optimizer" section). Structurally scoped
            # to load-test-originated calls and explicit
            # ext.model_params.explore opt-ins only (see
            # shared/load_test_context.py's get_is_load_test()) -- this value
            # has no effect on real auction traffic regardless of what it is
            # set to.
            - name: YIELD_EXPLORATION_EPSILON
              value: "0.1"
          # A 500m CPU limit means 50ms of CPU per 100ms CFS period: once a
          # request exhausts it the pod is throttled until the next period,
          # adding latency in 100ms multiples. That compounded with the
          # blocking-mutate() serialisation (see shared/server.py's
          # _await_mutate) to produce hundreds-of-ms container latencies in
          # load tests. The limit is raised well above the request so bursts
          # (JSON parse + pydantic validation + numpy + Triton round trip
          # across ARTF_MUTATE_WORKERS threads) are not clipped; the request
          # is what the scheduler and the HPA's 70% target both work from.
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: yield-optimizer-floor
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: mcp
    - port: 8080
      targetPort: 8080
      name: health
    - port: 50051
      targetPort: 50051
      name: grpc
  selector:
    app: artf
    model: yield-floor

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yield-floor-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1

<rect width="1560" height="960" fill="#F8FAFC"/>
<g filter="url(#ambIndigo)"><rect x="40" y="36" width="1480" height="150" rx="18" fill="url(#hdr)" stroke="#E0E7FF"/></g>
<rect x="40" y="36" width="7" height="150" rx="3.5" fill="#6366F1"/>
<text x="74" y="78" font-size="13" font-weight="700" fill="#6366F1" letter-spacing="0.14em">OPTIONAL HOST: PREBID SERVER</text>
<text x="74" y="116" font-size="28" font-weight="700" fill="#0F172A">One page load through Prebid Server with the ARTF hook installed</text>
<text x="74" y="146" font-size="14" fill="#475569">The hook enriches the request at processed-auction-request, before any bidder sees it. Prebid then runs the auction it always runs.</text>
<text x="74" y="166" font-size="14" fill="#475569">The orchestrator is the same one the UI calls; the Prebid pod reaches it by in-cluster Service name.</text>
<g filter="url(#amb)"><rect x="40" y="230" width="260" height="112" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="40" y="230" width="6" height="112" rx="3" fill="#1D4ED8"/>
<use href="#ic-browser" x="58" y="245" width="22" height="22" color="#1D4ED8"/>
<text x="88" y="262" font-size="15" font-weight="700" fill="#0F172A">Publisher page (prebid.js)</text>
<text x="58" y="284" font-size="12.5" fill="#334155">builds an OpenRTB 2.x request from</text>
<text x="58" y="302" font-size="12.5" fill="#334155">the ad units and any deals attached</text>
<text x="58" y="320" font-size="12.5" fill="#334155">to the impression</text>
<path d="M300 286 L348 286" stroke="#1D4ED8" stroke-width="2" fill="none" marker-end="url(#arwBlue)"/>
<text x="40" y="362" font-size="11.5" font-weight="500" fill="#1D4ED8" text-anchor="start" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">1. POST /openrtb2/auction  (tmax set by the page)</text>
<rect x="352" y="214" width="1108" height="146" rx="20" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
<text x="380" y="246" font-size="13" font-weight="700" fill="#1D4ED8" letter-spacing="0.12em">PREBID SERVER (EKS, SAME CLUSTER)</text>
<g filter="url(#amb)"><rect x="376" y="252" width="300" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="376" y="252" width="6" height="96" rx="3" fill="#1D4ED8"/>
<use href="#ic-hook" x="394" y="267" width="22" height="22" color="#1D4ED8"/>
<text x="424" y="284" font-size="15" font-weight="700" fill="#0F172A">2. ARTF hook module</text>
<text x="394" y="306" font-size="12.5" fill="#334155">checks the remaining budget, calls the</text>
<text x="394" y="324" font-size="12.5" fill="#334155">orchestrator, applies the returned list</text>
<text x="394" y="342" font-size="12.5" fill="#334155">to the bid request</text>
<g filter="url(#amb)"><rect x="700" y="252" width="340" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="700" y="252" width="6" height="96" rx="3" fill="#1D4ED8"/>
<use href="#ic-gavel" x="718" y="267" width="22" height="22" color="#1D4ED8"/>
<text x="748" y="284" font-size="15" font-weight="700" fill="#0F172A">5. Bidder fan-out</text>
<text x="718" y="306" font-size="12.5" fill="#334155">every seat, including third-party</text>
<text x="718" y="324" font-size="12.5" fill="#334155">bidders you add, receives the</text>
<text x="718" y="342" font-size="12.5" fill="#334155">enriched request</text>
<g filter="url(#amb)"><rect x="1064" y="252" width="372" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="1064" y="252" width="6" height="96" rx="3" fill="#1D4ED8"/>
<use href="#ic-scale" x="1082" y="267" width="22" height="22" color="#1D4ED8"/>
<text x="1112" y="284" font-size="15" font-weight="700" fill="#0F172A">8. Auction resolution</text>
<text x="1082" y="306" font-size="12.5" fill="#334155">floors, currency, top bid per impression,</text>
<text x="1082" y="324" font-size="12.5" fill="#334155">hb_* targeting keys, ext.seatnonbid;</text>
<text x="1082" y="342" font-size="12.5" fill="#334155">response returns to the page</text>
<path d="M676 300 L698 300" stroke="#1D4ED8" stroke-width="2" fill="none" marker-end="url(#arwBlue)"/>
<path d="M1040 300 L1062 300" stroke="#1D4ED8" stroke-width="2" fill="none" marker-end="url(#arwBlue)"/>
<path d="M480 348 L480 420" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#arw)"/>
<text x="556" y="392" font-size="11.5" font-weight="500" fill="#6366F1" text-anchor="start" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">3. POST /v1/mutations  (Cognito client_credentials bearer held in memory)</text>
<path d="M540 422 L540 350" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#arw)"/>
<text x="556" y="412" font-size="11.5" font-weight="500" fill="#6366F1" text-anchor="start" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">4. stage-ordered mutations with per-container status</text>
<rect x="40" y="424" width="1420" height="200" rx="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
<text x="68" y="456" font-size="13" font-weight="700" fill="#4338CA" letter-spacing="0.12em">ORCHESTRATOR (EKS)   STAGES 1 TO 3 RUN; STAGE 4 IS INERT BECAUSE NO BIDS EXIST YET</text>
<g filter="url(#amb)"><rect x="68" y="476" width="330" height="124" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="68" y="476" width="6" height="124" rx="3" fill="#0891B2"/>
<use href="#ic-signal" x="86" y="491" width="22" height="22" color="#0891B2"/>
<text x="116" y="508" font-size="15" font-weight="700" fill="#0F172A">Stage 1: enrich</text>
<text x="86" y="530" font-size="12.5" fill="#334155">Signals Enricher, Audience Activator</text>
<text x="86" y="548" font-size="12.5" fill="#334155">write imp.metric and user.data</text>
<g filter="url(#amb)"><rect x="422" y="476" width="330" height="124" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="422" y="476" width="6" height="124" rx="3" fill="#D97706"/>
<use href="#ic-handshake" x="440" y="491" width="22" height="22" color="#D97706"/>
<text x="470" y="508" font-size="15" font-weight="700" fill="#0F172A">Stage 2: deals</text>
<text x="440" y="530" font-size="12.5" fill="#334155">Deal Scorer activates or suppresses</text>
<text x="440" y="548" font-size="12.5" fill="#334155">deals in imp.pmp.deals (NCF on GPU)</text>
<g filter="url(#amb)"><rect x="776" y="476" width="330" height="124" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="776" y="476" width="6" height="124" rx="3" fill="#BE185D"/>
<use href="#ic-scale" x="794" y="491" width="22" height="22" color="#BE185D"/>
<text x="824" y="508" font-size="15" font-weight="700" fill="#0F172A">Stage 3: yield</text>
<text x="794" y="530" font-size="12.5" fill="#334155">Yield Optimizer Floor and Margin</text>
<text x="794" y="548" font-size="12.5" fill="#334155">adjust the deals now on the request</text>
<text x="794" y="566" font-size="12.5" fill="#334155">(XGBoost on GPU)</text>
<g filter="url(#amb)"><rect x="1130" y="476" width="306" height="124" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="1130" y="476" width="6" height="124" rx="3" fill="#76B900"/>
<use href="#ic-gpu" x="1148" y="491" width="22" height="22" color="#76B900"/>
<text x="1178" y="508" font-size="15" font-weight="700" fill="#0F172A">NVIDIA Triton (GPU)</text>
<text x="1148" y="530" font-size="12.5" fill="#334155">serves NCF and both XGBoost models</text>
<text x="1148" y="548" font-size="12.5" fill="#334155">for stages 2 and 3</text>
<path d="M398 538 L420 538" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#arw)"/>
<path d="M752 538 L774 538" stroke="#6366F1" stroke-width="2" fill="none" marker-end="url(#arw)"/>
<path d="M1106 538 L1128 538" stroke="#76B900" stroke-width="2" fill="none" marker-end="url(#arwNv)" stroke-dasharray="6 5"/>
<path d="M870 348 L870 372 L1482 372 L1482 640 L1300 640 L1300 662" stroke="#1D4ED8" stroke-width="2" fill="none" marker-end="url(#arwBlue)"/>
<text x="1470" y="366" font-size="11.5" font-weight="500" fill="#1D4ED8" text-anchor="end" stroke="#F8FAFC" stroke-width="4" paint-order="stroke">6. OpenRTB request to each seat</text>
<rect x="40" y="664" width="1420" height="230" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="68" y="696" font-size="13" font-weight="700" fill="#64748B" letter-spacing="0.12em">THE SEATS THAT BID</text>
<g filter="url(#amb)"><rect x="68" y="712" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="68" y="712" width="6" height="160" rx="3" fill="#16A34A"/>
<use href="#ic-catalog" x="86" y="727" width="22" height="22" color="#16A34A"/>
<text x="116" y="744" font-size="15" font-weight="700" fill="#0F172A">artfhouse adapter, then its demand endpoint</text>
<text x="86" y="766" font-size="12.5" fill="#334155">API Gateway + Lambda holding a campaign</text>
<text x="86" y="784" font-size="12.5" fill="#334155">catalog: matches deals on the impression,</text>
<text x="86" y="802" font-size="12.5" fill="#334155">compares each campaign's CPM to the floor,</text>
<text x="86" y="820" font-size="12.5" fill="#334155">returns a seatbid or a per-campaign</text>
<text x="86" y="838" font-size="12.5" fill="#334155">exclusion reason</text>
<g filter="url(#amb)"><rect x="532" y="712" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="532" y="712" width="6" height="160" rx="3" fill="#64748B"/>
<use href="#ic-server" x="550" y="727" width="22" height="22" color="#64748B"/>
<text x="580" y="744" font-size="15" font-weight="700" fill="#0F172A">amt simulator (in-cluster)</text>
<text x="550" y="766" font-size="12.5" fill="#334155">static creatives at fixed CPMs from the</text>
<text x="550" y="784" font-size="12.5" fill="#334155">AWS Prebid Server guidance release; the</text>
<text x="550" y="802" font-size="12.5" fill="#334155">outside buyer the activated deals compete</text>
<text x="550" y="820" font-size="12.5" fill="#334155">against. Remove it with --no-simulator.</text>
<g filter="url(#amb)"><rect x="996" y="712" width="440" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
<rect x="996" y="712" width="6" height="160" rx="3" fill="#64748B"/>
<use href="#ic-users" x="1014" y="727" width="22" height="22" color="#64748B"/>
<text x="1044" y="744" font-size="15" font-weight="700" fill="#0F172A">Your bidders</text>
<text x="1014" y="766" font-size="12.5" fill="#334155">any third-party adapter you configure in</text>
<text x="1014" y="784" font-size="12.5" fill="#334155">prebid-config.yaml bids on the same</text>
<text x="1014" y="802" font-size="12.5" fill="#334155">enriched request</text>
<path d="M1460 800 L1516 800 L1516 300 L1438 300" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arwG)" stroke-dasharray="6 5"/>
<text transform="translate(1540 560) rotate(-90)" font-size="11.5" font-weight="500" fill="#16A34A" text-anchor="middle">7. seatbid (or nothing, with reasons) back to Prebid for resolution</text>
</svg>

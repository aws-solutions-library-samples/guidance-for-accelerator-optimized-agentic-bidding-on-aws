services:
  # -----------------------------------------------------------------------
  # ARTF Orchestrator — fans out to containers via gRPC and HTTP
  # -----------------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
      args:
        AGENT_NAME: artf-orchestrator
    ports:
      - "8080:8000"   # REST API for the frontend
    environment:
      DLRM_GRPC: bid-pricer:50051
      DLRM_MCP: http://bid-pricer:8081
      WIDEDEEP_GRPC: audience-activator:50051
      WIDEDEEP_MCP: http://audience-activator:8081
      NCF_GRPC: deal-scorer:50051
      NCF_MCP: http://deal-scorer:8081
      METRICS_GRPC: signals-enricher:50051
      METRICS_MCP: http://signals-enricher:8081
      YIELD_FLOOR_GRPC: yield-optimizer-floor:50051
      YIELD_FLOOR_MCP: http://yield-optimizer-floor:8081
      YIELD_MARGIN_GRPC: yield-optimizer-margin:50051
      YIELD_MARGIN_MCP: http://yield-optimizer-margin:8081
    depends_on:
      bid-pricer:
        condition: service_healthy
      audience-activator:
        condition: service_healthy
      deal-scorer:
        condition: service_healthy
      signals-enricher:
        condition: service_healthy
      yield-optimizer-floor:
        condition: service_healthy
      yield-optimizer-margin:
        condition: service_healthy
    networks:
      - artf

  # -----------------------------------------------------------------------
  # Bid Pricer — BID_SHADE intent
  # Ports: gRPC 50051, MCP 8081, Health 8080
  # -----------------------------------------------------------------------
  bid-pricer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER: containers/dlrm_bid_shader
        AGENT_NAME: dlrm-bid-shader
    expose:
      - "50051"
      - "8081"
      - "8080"
    ports:
      - "50061:50051"  # gRPC exposed to host
      - "8091:8081"    # MCP exposed to host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artf

  # -----------------------------------------------------------------------
  # Audience Activator — ACTIVATE_SEGMENTS intent (rule-based, no
  # Triton dependency; see source/containers/widedeep_segment_activator/app.py)
  # -----------------------------------------------------------------------
  audience-activator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER: containers/widedeep_segment_activator
        AGENT_NAME: widedeep-segment-activator
    expose:
      - "50051"
      - "8081"
      - "8080"
    ports:
      - "50062:50051"
      - "8092:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artf

  # -----------------------------------------------------------------------
  # Deal Scorer — ACTIVATE_DEALS / SUPPRESS_DEALS intents
  # -----------------------------------------------------------------------
  deal-scorer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER: containers/ncf_deal_manager
        AGENT_NAME: ncf-deal-manager
    expose:
      - "50051"
      - "8081"
      - "8080"
    ports:
      - "50063:50051"
      - "8093:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artf

  # -----------------------------------------------------------------------
  # Signals Enricher — ADD_METRICS intent
  # -----------------------------------------------------------------------
  signals-enricher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER: containers/metrics_enricher
        AGENT_NAME: metrics-enricher
    expose:
      - "50051"
      - "8081"
      - "8080"
    ports:
      - "50064:50051"
      - "8094:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artf

  # -----------------------------------------------------------------------
  # Yield Optimizer (Floor) — ADJUST_DEAL_FLOOR intent
  # (Triton FIL-backend XGBoost model; see
  # source/containers/yield_optimizer_floor/app.py)
  #
  # Two services, not one: FIL cannot serve a two-output tree model, so the
  # floor and margin predictions were always two separate models. Splitting the
  # containers stops one model's availability from gating the other's (BR-5).
  # -----------------------------------------------------------------------
  yield-optimizer-floor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER: containers/yield_optimizer_floor
        AGENT_NAME: yield-optimizer-floor
    expose:
      - "50051"
      - "8081"
      - "8080"
    ports:
      - "50065:50051"
      - "8095:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artf

  # -----------------------------------------------------------------------
  # Yield Optimizer (Margin) — ADJUST_DEAL_MARGIN intent
  # (Triton FIL-backend XGBoost model; see
  # source/containers/yield_optimizer_margin/app.py)
  # -----------------------------------------------------------------------
  yield-optimizer-margin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER: containers/yield_optimizer_margin
        AGENT_NAME: yield-optimizer-margin
    expose:
      - "50051"
      - "8081"
      - "8080"
    ports:
      - "50066:50051"
      - "8096:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - artf

networks:
  artf:
    driver: bridge
